<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tombol Sirine</title>
  <link rel="preload" as="audio" href="assets/sirine.mp3" type="audio/mpeg" fetchpriority="high" />
  <style>
    :root{ --red:#ff1a1a; --red-dark:#e00000; --bg:#0d0d0d; --txt:#fff; }
    *{ box-sizing:border-box }
    html,body{ height:100% }
    body{
      margin:0; background:var(--bg); color:var(--txt);
      display:grid; place-items:center;
      padding:max(24px, env(safe-area-inset-top))
              max(24px, env(safe-area-inset-right))
              max(24px, env(safe-area-inset-bottom))
              max(24px, env(safe-area-inset-left));
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    .wrap{ width:100%; max-width:680px; display:flex; justify-content:center; align-items:center; }
    #sirenBtn{
      appearance:none; border:0; outline:0; cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none;
      background:linear-gradient(180deg,var(--red),var(--red-dark)); color:#fff; text-transform:uppercase;
      font-weight:900; letter-spacing:.5px; border-radius:999px;
      box-shadow:0 10px 28px rgba(255,0,0,.45), 0 0 0 4px rgba(255,255,255,.05) inset;
      width:clamp(240px,88vw,240px); height:clamp(72px,18vh,160px);
      font-size:clamp(1.25rem,6vw,2rem); padding:0 28px; margin:6vh 6vw;
      transition:transform .02s ease, filter .02s ease, box-shadow .2s ease;
    }
    #sirenBtn:active{ transform:translateY(1px) scale(.99); filter:brightness(.95);
      box-shadow:0 6px 16px rgba(255,0,0,.35), 0 0 0 2px rgba(255,255,255,.06) inset; }
    #sirenBtn:focus-visible{ box-shadow:0 0 0 4px rgba(255,255,255,.25), 0 10px 24px rgba(255,0,0,.55); }
    .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
      clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0; }
  </style>
</head>
<body>
  <div class="wrap">
    <button id="sirenBtn" aria-pressed="false" aria-describedby="hint">Sirine</button>
    <span id="hint" class="sr-only">Menekan tombol akan memulai suara sirine.</span>
  </div>

  <!-- Pakai src langsung (lebih stabil di iOS) -->
  <audio id="sirenAudio" preload="auto" playsinline crossorigin="anonymous" src="assets/sirine.mp3"></audio>

  <script>
    (function () {
      const btn = document.getElementById('sirenBtn');
      const audio = document.getElementById('sirenAudio');

      // Siapkan sejak awal
      window.addEventListener('load', () => {
        try { audio.load(); } catch {}
      });

      // UNLOCK: pastikan audio diizinkan & decoded sebelum tombol handler jalan.
      let unlocked = false;
      const unlock = () => {
        if (unlocked) return;
        // Coba play lalu pause secepatnya untuk "meng-unlock" tanpa bunyi
        audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
          unlocked = true;
        }).catch(() => {
          // Abaikan; di beberapa browser akan sukses ketika tombol ditekan
        });
      };
      // Pakai capture agar ini dieksekusi sebelum handler tombol
      document.addEventListener('pointerdown', unlock, { once:true, passive:true, capture:true });

      // Main handler: respons instan saat ditekan
      const startSiren = async () => {
        try {
          // audio.loop = true; // buka jika ingin berulang
          if (audio.readyState < 2) audio.load();
          audio.currentTime = 0;
          await audio.play();
          btn.setAttribute('aria-pressed', 'true');
        } catch (e) {
          console.error('Audio play error:', e, 'readyState:', audio.readyState, 'networkState:', audio.networkState, 'error:', audio.error);
          btn.textContent = 'Audio gagal diputar. Cek path & format (assets/sirine.mp3)';
        }
      };

      btn.addEventListener('pointerdown', startSiren, { passive:true });

      // Aksesibilitas keyboard
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          startSiren();
        }
      });
    })();
  </script>
</body>
</html>
