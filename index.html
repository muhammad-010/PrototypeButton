<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Control System</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .button {
            width: 80%;
            max-width: 300px;
            height: 100px;
            margin: 20px;
            border: none;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .button:active {
            transform: scale(0.95);
        }

        #sirenButton {
            background-color: #ff4444;
        }

        #micButton {
            background-color: #44aa44;
        }

        #micButton.active {
            background-color: #ff6b6b;
        }

        .status {
            margin-top: 20px;
            font-size: 1em;
            color: #333;
        }
    </style>
</head>
<body>
    <button id="sirenButton" class="button">Play Siren</button>
    <button id="micButton" class="button">Start Microphone</button>
    <div id="status" class="status"></div>

    <script>
        let audioContext;
        let micStream;
        let mediaStreamSource;
        let gainNode;
        let audioElement;
        let isMicActive = false;
        let keepAliveInterval;
        const sirenButton = document.getElementById('sirenButton');
        const micButton = document.getElementById('micButton');
        const statusDiv = document.getElementById('status');
        const sirenAudio = new Audio('assets/sirine.mp3');

        // Debug info display
        function updateDebugInfo(message) {
            console.log(message);
            statusDiv.textContent = message;
        }

        // Initialize audio context
        async function initAudioContext() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                return true;
            } catch (error) {
                updateDebugInfo('Audio Context Error: ' + error.message);
                return false;
            }
        }

        // Siren button functionality
        sirenButton.addEventListener('click', async () => {
            if (sirenAudio.paused) {
                await initAudioContext(); // Ensure audio context is initialized
                sirenAudio.play().catch(error => {
                    updateDebugInfo('Error playing siren: ' + error.message);
                });
                sirenButton.textContent = 'Stop Siren';
            } else {
                sirenAudio.pause();
                sirenAudio.currentTime = 0;
                sirenButton.textContent = 'Play Siren';
            }
        });

        // Keep audio alive function
        function startKeepAlive() {
            if (keepAliveInterval) {
                clearInterval(keepAliveInterval);
            }
            keepAliveInterval = setInterval(async () => {
                if (audioContext && audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                if (audioElement && audioElement.paused) {
                    try {
                        await audioElement.play();
                    } catch (e) {
                        console.log('Keep-alive play error:', e);
                    }
                }
            }, 500);
        }

        // Setup audio processing chain
        async function setupAudioChain(stream) {
            if (!await initAudioContext()) return null;

            try {
                // Create source from microphone stream
                mediaStreamSource = audioContext.createMediaStreamSource(stream);
                
                // Create gain node for volume control
                gainNode = audioContext.createGain();
                gainNode.gain.value = 2.0; // Increased gain
                
                // Create media stream destination to route back to speakers
                const destination = audioContext.createMediaStreamDestination();
                
                // Connect the audio chain
                mediaStreamSource.connect(gainNode);
                gainNode.connect(audioContext.destination); // Direct connection to output
                
                // Create and configure audio element
                audioElement = new Audio();
                audioElement.srcObject = stream;
                audioElement.autoplay = true;
                audioElement.muted = true; // Mute to prevent feedback
                await audioElement.play();
                
                return true;
            } catch (error) {
                updateDebugInfo('Audio Chain Error: ' + error.message);
                return false;
            }
        }

        // Microphone button functionality
        micButton.addEventListener('click', async () => {
            if (!isMicActive) {
                try {
                    updateDebugInfo('Requesting microphone access...');
                    
                    // Request microphone with specific constraints for mobile
                    const constraints = {
                        audio: {
                            echoCancellation: true, // Enable echo cancellation for better mobile performance
                            noiseSuppression: true, // Enable noise suppression for better mobile performance
                            autoGainControl: true,  // Enable auto gain for better mobile performance
                            latency: 0,
                            channelCount: 1,
                            sampleRate: 48000,
                            sampleSize: 16
                        }
                    };

                    // Get microphone stream
                    micStream = await navigator.mediaDevices.getUserMedia(constraints);
                    updateDebugInfo('Microphone access granted. Setting up audio...');

                    // Setup audio chain
                    if (!(await setupAudioChain(micStream))) {
                        throw new Error('Failed to setup audio chain');
                    }

                    // Start keep-alive mechanism
                    startKeepAlive();

                    isMicActive = true;
                    micButton.textContent = 'Stop Microphone';
                    micButton.classList.add('active');
                    updateDebugInfo('Microphone active - audio should be playing');

                } catch (error) {
                    console.error('Setup error:', error);
                    updateDebugInfo('Error: ' + error.message);
                    await stopMicrophone();
                }
            } else {
                await stopMicrophone();
            }
        });

        // Function to stop microphone and cleanup
        async function stopMicrophone() {
            if (keepAliveInterval) {
                clearInterval(keepAliveInterval);
                keepAliveInterval = null;
            }

            if (audioElement) {
                audioElement.pause();
                audioElement.srcObject = null;
                audioElement = null;
            }

            if (micStream) {
                micStream.getTracks().forEach(track => {
                    track.stop();
                    updateDebugInfo('Stopping track: ' + track.label);
                });
            }

            if (mediaStreamSource) {
                mediaStreamSource.disconnect();
            }

            if (gainNode) {
                gainNode.disconnect();
            }

            if (audioContext) {
                await audioContext.close();
                audioContext = null;
            }

            isMicActive = false;
            micButton.textContent = 'Start Microphone';
            micButton.classList.remove('active');
            updateDebugInfo('Microphone stopped');
        }

        // Handle page visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (micStream) {
                    stopMicrophone();
                }
                sirenAudio.pause();
                sirenAudio.currentTime = 0;
                sirenButton.textContent = 'Play Siren';
                updateDebugInfo('Audio stopped due to page becoming inactive');
            }
        });
    </script>
</body>
</html>
