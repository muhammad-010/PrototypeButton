<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Control System</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .button {
            width: 80%;
            max-width: 300px;
            height: 100px;
            margin: 20px;
            border: none;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .button:active {
            transform: scale(0.95);
        }

        #sirenButton {
            background-color: #ff4444;
        }

        #micButton {
            background-color: #44aa44;
        }

        #micButton.active {
            background-color: #ff6b6b;
        }

        .status {
            margin-top: 20px;
            font-size: 1em;
            color: #333;
        }
    </style>
</head>
<body>
    <button id="sirenButton" class="button">Play Siren</button>
    <button id="micButton" class="button">Start Microphone</button>
    <div id="status" class="status"></div>

    <script>
        let audioContext;
        let micStream;
        let mediaStreamSource;
        let gainNode;
        let isMicActive = false;
        const sirenButton = document.getElementById('sirenButton');
        const micButton = document.getElementById('micButton');
        const statusDiv = document.getElementById('status');
        const sirenAudio = new Audio('assets/sirine.mp3');

        // Debug info display
        function updateDebugInfo(message) {
            console.log(message);
            statusDiv.textContent = message;
        }

        // Initialize audio context
        async function initAudioContext() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                return true;
            } catch (error) {
                updateDebugInfo('Audio Context Error: ' + error.message);
                return false;
            }
        }

        // Siren button functionality
        sirenButton.addEventListener('click', async () => {
            if (sirenAudio.paused) {
                sirenAudio.play().catch(error => {
                    updateDebugInfo('Error playing siren: ' + error.message);
                });
                sirenButton.textContent = 'Stop Siren';
            } else {
                sirenAudio.pause();
                sirenAudio.currentTime = 0;
                sirenButton.textContent = 'Play Siren';
            }
        });

        // Setup audio processing chain
        async function setupAudioChain(stream) {
            if (!await initAudioContext()) return null;

            try {
                // Create source from microphone stream
                mediaStreamSource = audioContext.createMediaStreamSource(stream);
                
                // Create gain node for volume control
                gainNode = audioContext.createGain();
                gainNode.gain.value = 2.0; // Increased gain
                
                // Create media stream destination to route back to speakers
                const destination = audioContext.createMediaStreamDestination();
                
                // Connect the audio chain
                mediaStreamSource.connect(gainNode);
                gainNode.connect(destination);
                
                // Create a new audio element with the processed stream
                const audioElement = new Audio();
                audioElement.srcObject = destination.stream;
                audioElement.play().catch(e => updateDebugInfo('Play Error: ' + e.message));
                
                return audioElement;
            } catch (error) {
                updateDebugInfo('Audio Chain Error: ' + error.message);
                return null;
            }
        }

        // Microphone button functionality
        micButton.addEventListener('click', async () => {
            if (!isMicActive) {
                try {
                    updateDebugInfo('Requesting microphone access...');
                    
                    // List available devices first
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const audioInputs = devices.filter(device => device.kind === 'audioinput');
                    console.log('Available audio inputs:', audioInputs);
                    
                    // Request microphone with specific constraints for mobile
                    const constraints = {
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false,
                            latency: 0,
                            channelCount: 1
                        }
                    };

                    // Get microphone stream
                    micStream = await navigator.mediaDevices.getUserMedia(constraints);
                    updateDebugInfo('Microphone access granted. Setting up audio...');

                    // Setup audio processing chain
                    const audioElement = await setupAudioChain(micStream);
                    if (!audioElement) {
                        throw new Error('Failed to setup audio chain');
                    }

                    // Force audio playback through media channel
                    audioElement.setSinkId ? 
                        audioElement.setSinkId('default').catch(e => console.log('setSinkId error:', e)) :
                        console.log('setSinkId not supported');

                    isMicActive = true;
                    micButton.textContent = 'Stop Microphone';
                    micButton.classList.add('active');
                    updateDebugInfo('Microphone active - audio should be playing through speaker');

                } catch (error) {
                    console.error('Setup error:', error);
                    updateDebugInfo('Error: ' + error.message);
                    stopMicrophone();
                }
            } else {
                stopMicrophone();
            }
        });

        // Function to stop microphone and cleanup
        function stopMicrophone() {
            if (micStream) {
                micStream.getTracks().forEach(track => {
                    track.stop();
                    updateDebugInfo('Stopping track: ' + track.label);
                });
            }
            if (mediaStreamSource) {
                mediaStreamSource.disconnect();
            }
            if (gainNode) {
                gainNode.disconnect();
            }
            isMicActive = false;
            micButton.textContent = 'Start Microphone';
            micButton.classList.remove('active');
            updateDebugInfo('Microphone stopped');
        }

        // Handle page visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isMicActive) {
                stopMicrophone();
            }
        });

        // Handle page visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Stop everything when page is hidden
                if (micStream) {
                    micStream.getTracks().forEach(track => track.stop());
                }
                sirenAudio.pause();
                sirenAudio.currentTime = 0;
                isMicActive = false;
                micButton.textContent = 'Start Microphone';
                micButton.classList.remove('active');
                sirenButton.textContent = 'Play Siren';
                statusDiv.textContent = 'Audio stopped due to page becoming inactive';
            }
        });
    </script>
</body>
</html>
