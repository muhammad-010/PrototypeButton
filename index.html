<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sirine & Bicara</title>
  <link rel="preload" as="audio" href="assets/sirine.mp3" type="audio/mpeg" fetchpriority="high" />
  <style>
    :root{
      --bg:#0d0d0d; --txt:#fff;
      --red:#ff1a1a; --red-dark:#d90000;
      --blue:#00aaff; --blue-dark:#0085cc;
      --page-pad: clamp(16px, 5vw, 48px);
      --stack-gap: clamp(12px, 3vh, 28px);
      --btn-block: clamp(72px, 18vh, 160px);
      --btn-text: clamp(1.05rem, 4.8vw, 1.6rem);
      --card:#121212; --card-bd:#242424;
      --ok:#24d160; --warn:#ffbb33;
    }
    *{ box-sizing:border-box }
    html,body{ height:100% }
    body{
      margin:0; background:var(--bg); color:var(--txt);
      display:grid; place-items:center;
      padding:
        max(var(--page-pad), env(safe-area-inset-top))
        max(var(--page-pad), env(safe-area-inset-right))
        max(var(--page-pad), env(safe-area-inset-bottom))
        max(var(--page-pad), env(safe-area-inset-left));
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    .wrap{
      width:100%; max-width:860px;
      display:flex; flex-direction:column; align-items:center; gap: var(--stack-gap);
      padding-inline: clamp(12px, 6vw, 48px);
    }

    .btn{
      appearance:none; border:0; outline:0; cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none;
      touch-action: manipulation; color:#fff; text-transform:uppercase; font-weight:900; letter-spacing:.5px;
      border-radius:999px; width:100%; height: var(--btn-block); font-size: var(--btn-text);
      margin-block: calc(var(--stack-gap) * 0.25);
      box-shadow:0 10px 28px rgba(0,0,0,.35), 0 0 0 4px rgba(255,255,255,.05) inset;
      transition: transform .02s, filter .06s, box-shadow .2s, background .12s;
    }
    .btn:active{ transform: translateY(1px) scale(.99); filter: brightness(.97); }
    .btn:focus-visible{ box-shadow:0 0 0 6px rgba(255,255,255,.25), 0 12px 28px rgba(0,0,0,.55); }
    #btnSiren{ background:linear-gradient(180deg, var(--red), var(--red-dark)); }
    #btnSiren[data-on="true"]{ background:linear-gradient(180deg, #cc0000, #a80000); box-shadow:0 12px 30px rgba(255,0,0,.45), 0 0 0 6px rgba(255,255,255,.08) inset; }
    #btnTalk{  background:linear-gradient(180deg, var(--blue), var(--blue-dark)); }
    #btnTalk[data-on="true"]{  background:linear-gradient(180deg, #008fd6, #006aa3); box-shadow:0 12px 30px rgba(0,170,255,.45), 0 0 0 6px rgba(255,255,255,.08) inset; }

    .card{
      width:100%; background:var(--card); border:1px solid var(--card-bd);
      border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:10px;
    }
    .row{ display:flex; flex-direction:column; gap:10px; }
    label{ font-size:.95rem; opacity:.9; }
    select, button.small{
      width:100%; max-width:100%; padding:10px 12px; border-radius:10px; border:1px solid #333;
      background:#161616; color:#fff; outline:none; font-size:.95rem;
    }
    button.small{
      border-color:#2a2a2a; background:#1c1c1c; cursor:pointer; text-transform:none; font-weight:600;
    }
    .bar{ display:flex; flex-direction:column; gap:10px; }
    .hint{ opacity:.8; font-size:.9rem; }
    .ok{ color:var(--ok); }
    .warn{ color:var(--warn); }

    /* Mic level meter */
    .meter{
      height:10px; width:100%; background:#1a1a1a; border-radius:999px; overflow:hidden; border:1px solid #2a2a2a;
    }
    .meter > span{
      display:block; height:100%; width:0%;
      background: linear-gradient(90deg, #3ec36b, #ffd166, #ff5e57);
      transition: width .06s linear;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <button id="btnSiren" class="btn" aria-pressed="false">Sirine: MATI</button>
    <button id="btnTalk"  class="btn" aria-pressed="false">Bicara: OFF</button>

    <div class="card">
      <div class="row">
        <label for="permBtn">1) Izin mikrofon</label>
        <button id="permBtn" class="small">Izinkan Akses Mic</button>
        <div class="hint">Wajib tekan ini di HP agar daftar perangkat <span class="ok">terbaca & berlabel</span>.</div>
      </div>

      <div class="row">
        <label for="micSelect">2) Pilih Input Mic</label>
        <select id="micSelect" disabled>
          <option>Mic belum terdeteksi — beri izin dulu</option>
        </select>
        <button id="refreshBtn" class="small">Muat Ulang Daftar Mic</button>
        <div class="meter" title="Level mic"><span id="meterFill"></span></div>
        <div id="micStatus" class="hint">Status: menunggu izin…</div>
      </div>

      <div class="row">
        <label for="sinkSelect">3) Pilih Output Speaker (opsional)</label>
        <select id="sinkSelect" disabled>
          <option>Browser tidak mendukung memilih output atau butuh izin</option>
        </select>
        <div class="hint">Untuk Bluetooth, pilih speaker di sini (jika Chrome mendukung <code>setSinkId</code>).</div>
      </div>
    </div>
  </div>

  <!-- Sirine -->
  <audio id="siren" preload="auto" playsinline src="assets/sirine.mp3"></audio>
  <!-- Monitor mic (membantu Safari/Android) -->
  <audio id="monitor" autoplay playsinline style="position:absolute; opacity:0; pointer-events:none;"></audio>

  let sirenElSrc; //MediaElementAudioSourceNode untuk sirine
  <script>
  (function(){
    const btnSiren = document.getElementById('btnSiren');
    const btnTalk  = document.getElementById('btnTalk');
    const sirenEl  = document.getElementById('siren');
    const monitorEl= document.getElementById('monitor');

    const permBtn  = document.getElementById('permBtn');
    const micSel   = document.getElementById('micSelect');
    const sinkSel  = document.getElementById('sinkSelect');
    const refreshBtn = document.getElementById('refreshBtn');
    const meterFill = document.getElementById('meterFill');
    const micStatus = document.getElementById('micStatus');

    // ---------- Sirine ----------
    window.addEventListener('load', () => { try { sirenEl.load(); } catch {} });
    sirenEl.loop = true;
    let sirenOn = false;

    async function toggleSiren(){
      try{
        await ensureCtxAndGraph();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        if (!sirenOn){
          if (sirenEl.readyState < 2) sirenEl.load();
          sirenEl.currentTime = 0;
          sirenEl.volume = 1;
          await sirenEl.play();            // sekarang suaranya lewat graph WebAudio
          sirenOn = true;
          btnSiren.dataset.on = "true";
          btnSiren.setAttribute('aria-pressed','true');
          btnSiren.textContent = 'Sirine: MENYALA';
        } else {
          sirenEl.pause();
          sirenEl.currentTime = 0;
          sirenOn = false;
          btnSiren.dataset.on = "false";
          btnSiren.setAttribute('aria-pressed','false');
          btnSiren.textContent = 'Sirine: MATI';
        }
      }catch(e){
        console.error('Siren error:', e);
        btnSiren.textContent = 'Periksa assets/sirine.mp3';
      }
    }

    // Unlock kebijakan media (tanpa bunyi)
    document.addEventListener('pointerdown', () => {
      try{ sirenEl.muted = true; sirenEl.play().then(()=>{sirenEl.pause();sirenEl.currentTime=0;sirenEl.muted=false;}).catch(()=>{});}catch{}
    }, { once:true, passive:true, capture:true });

    btnSiren.addEventListener('pointerdown', e => { e.preventDefault(); toggleSiren(); }, {passive:false});

    // ---------- Mic monitor ----------
    let audioCtx, micStream, micSource, gateGain, dryGain, wetGain, outGain, convolver, mediaDest, analyser, rafId;
    let talkOn = false;
    let selectedMicId = null;

    function makeReverbIR(ctx, seconds=2.2, decay=2.6){
      const rate = ctx.sampleRate, len = Math.max(1, Math.floor(rate*seconds));
      const ir = ctx.createBuffer(2, len, rate);
      for(let ch=0; ch<2; ch++){
        const data = ir.getChannelData(ch);
        for(let i=0;i<len;i++){ const t=i/len; data[i]=(Math.random()*2-1)*Math.pow(1-t,decay); }
      }
      return ir;
    }

    async function ensureCtxAndGraph(){
      if (!audioCtx){
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC({ latencyHint: "interactive" });
      }
      if (!gateGain){
        gateGain = audioCtx.createGain(); gateGain.gain.value = 0;
        dryGain  = audioCtx.createGain(); dryGain.gain.value = 0.90;
        wetGain  = audioCtx.createGain(); wetGain.gain.value = 0.45;
        outGain  = audioCtx.createGain(); outGain.gain.value = 1.0;
        convolver= audioCtx.createConvolver(); convolver.buffer = makeReverbIR(audioCtx, 2.4, 2.6);

        // Rangkaian mic
        // (micSource akan diset saat startMicWithDevice)
        gateGain.connect(dryGain);     dryGain.connect(outGain);
        gateGain.connect(convolver);   convolver.connect(wetGain); wetGain.connect(outGain);

        // Output ke speaker + monitor <audio>
        outGain.connect(audioCtx.destination);
        mediaDest = audioCtx.createMediaStreamDestination();
        outGain.connect(mediaDest);
        monitorEl.srcObject = mediaDest.stream;
        monitorEl.autoplay = true; monitorEl.playsInline = true; monitorEl.muted = false;
      }

      // >>> NEW: sambungkan elemen <audio id="siren"> ke graph yang sama
      if (!sirenElSrc){
        sirenElSrc = audioCtx.createMediaElementSource(sirenEl);
        sirenElSrc.connect(outGain);
      }
    }

    function stopMicStream(){
      if (micStream){
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (micSource){
        try{ micSource.disconnect(); }catch{}
        micSource = null;
      }
    }

    // FIX: definisi fungsi async yang benar (placeholder)
    async function reconnectMic() {
      // dummy to allow naming before usage if needed
    }

    async function startMicWithDevice(deviceId){
      await ensureCtxAndGraph();
      // hentikan yang lama
      stopMicStream();
      // bikin yang baru
      const constraints = {
        audio:{
          deviceId: deviceId ? { exact: deviceId } : undefined,
          echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1
        }
      };
      micStream = await navigator.mediaDevices.getUserMedia(constraints);
      micSource = audioCtx.createMediaStreamSource(micStream);
      micSource.connect(gateGain);
      micStatus.innerHTML = `Mic aktif: <span class="ok">${(micSel.selectedOptions[0]?.textContent)||'Default'}</span>`;
      // update meter loop
      if (rafId) cancelAnimationFrame(rafId);
      const data = new Uint8Array(analyser.fftSize);
      const loop = () => {
        analyser.getByteTimeDomainData(data);
        // hitung puncak (RMS sederhana)
        let sum = 0;
        for (let i=0;i<data.length;i++){ const v = (data[i]-128)/128; sum += v*v; }
        const rms = Math.sqrt(sum / data.length); // 0..1
        const pct = Math.min(100, Math.max(0, Math.round(rms*140))); // boost sedikit
        meterFill.style.width = pct + '%';
        rafId = requestAnimationFrame(loop);
      };
      loop();
    }

    function setGate(on){
      if (!audioCtx || !gateGain) return;
      const now = audioCtx.currentTime;
      gateGain.gain.cancelScheduledValues(now);
      gateGain.gain.setTargetAtTime(on?1:0, now, 0.012);
      btnTalk.dataset.on = on ? "true" : "false";
      btnTalk.setAttribute('aria-pressed', on ? 'true' : 'false');
      btnTalk.textContent = on ? 'Bicara: ON' : 'Bicara: OFF';
    }

    async function toggleTalk(){
      try{
        await ensureCtxAndGraph();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        if (!talkOn){
          // Jika belum ada stream mic, coba mulai dengan device terpilih
          if (!micStream) {
            try{
              await startMicWithDevice(selectedMicId);
            }catch(e){
              console.error('Tidak bisa mulai mic:', e);
              micStatus.innerHTML = `<span class="warn">Gagal membuka mic. Coba pilih device lain atau beri izin.</span>`;
              return;
            }
          }
          try { await monitorEl.play(); } catch {}
          setGate(true);
          talkOn = true;
        } else {
          setGate(false);
          talkOn = false;
        }
      }catch(e){
        console.error('Talk error:', e);
        btnTalk.textContent = 'Izin mic ditolak? Cek permission.';
      }
    }

    btnTalk.addEventListener('pointerdown', e => { e.preventDefault(); toggleTalk(); }, {passive:false});

    // Matikan mic saat tab disembunyikan
    document.addEventListener('visibilitychange', ()=>{
      if (document.hidden && talkOn){
        setGate(false);
        talkOn = false;
      }
    });

    // ---------- Permission & device lists ----------
    async function requestMicPermission(){
      try{
        // panggil getUserMedia singkat untuk membuka izin & memberi label device
        const s = await navigator.mediaDevices.getUserMedia({audio:true});
        s.getTracks().forEach(t => t.stop());
        micStatus.textContent = 'Izin mic diberikan.';
      }catch(e){
        micStatus.innerHTML = `<span class="warn">Izin mic ditolak. Buka ikon kunci/URL bar → izinkan mikrofon.</span>`;
        throw e;
      }
    }

    async function populateMicInputs(){
      if (!navigator.mediaDevices?.enumerateDevices) {
        micSel.disabled = true;
        micSel.innerHTML = '<option>Browser tidak mendukung enumerateDevices</option>';
        return;
      }
      const devs = await navigator.mediaDevices.enumerateDevices();
      const inputs = devs.filter(d => d.kind === 'audioinput');
      if (!inputs.length){
        micSel.disabled = true;
        micSel.innerHTML = '<option>Tidak ada audioinput terdeteksi</option>';
        return;
      }
      micSel.disabled = false;
      micSel.innerHTML = inputs.map(d => {
        const label = d.label || 'Mikrofon';
        return `<option value="${d.deviceId}">${label}</option>`;
      }).join('');
      // pilih sebelumnya jika ada
      if (selectedMicId){
        const opt = [...micSel.options].find(o => o.value === selectedMicId);
        if (opt) micSel.value = selectedMicId;
      } else {
        selectedMicId = micSel.value;
      }
    }

    async function populateSinks(){
      if (!('sinkId' in HTMLMediaElement.prototype)) {
        sinkSel.disabled = true;
        sinkSel.innerHTML = '<option>Browser tidak mendukung memilih output</option>';
        return;
      }
      try{ await navigator.mediaDevices.getUserMedia({audio:true}); }catch{}
      const devs = await navigator.mediaDevices.enumerateDevices();
      const outs = devs.filter(d => d.kind === 'audiooutput');
      if (!outs.length){ sinkSel.disabled = true; sinkSel.innerHTML = '<option>Tidak ada audiooutput</option>'; return; }
      sinkSel.disabled = false;
      sinkSel.innerHTML = outs.map(d => `<option value="${d.deviceId}">${d.label || 'Speaker'}</option>`).join('');
    }

    async function applySink(deviceId){
      if (!('setSinkId' in HTMLMediaElement.prototype)) return;
      try{
        await monitorEl.setSinkId(deviceId);
      }catch(e){
        console.warn('setSinkId gagal:', e);
      }
    }

    // Events
    permBtn.addEventListener('click', async ()=>{
      try{
        await requestMicPermission();
        await populateMicInputs();
        await populateSinks();
        micStatus.innerHTML = 'Izin mic diberikan. Pilih input lalu klik <b>Bicara</b>.';
      }catch{}
    });

    refreshBtn.addEventListener('click', async ()=>{
      await populateMicInputs();
      await populateSinks();
    });

    micSel.addEventListener('change', async ()=>{
      selectedMicId = micSel.value || null;
      // Jika sedang ON, pindah langsung ke mic baru
      if (talkOn){
        try{
          await startMicWithDevice(selectedMicId);
          // pastikan gate tetap ON
          setGate(true);
        }catch(e){
          console.error('Gagal switch mic:', e);
          micStatus.innerHTML = `<span class="warn">Tidak bisa membuka mic terpilih. Coba device lain.</span>`;
        }
      }
    });

    sinkSel.addEventListener('change', async ()=>{ await applySink(sinkSel.value); });

    navigator.mediaDevices?.addEventListener?.('devicechange', async ()=>{
      await populateMicInputs();
      await populateSinks();
    });

    // Init lists (label mungkin kosong sampai izin diberikan)
    populateMicInputs();
    populateSinks();
  })();
  </script>
</body>
</html>
