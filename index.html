<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Control System</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .button {
            width: 80%;
            max-width: 300px;
            height: 100px;
            margin: 20px;
            border: none;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .button:active {
            transform: scale(0.95);
        }

        #sirenButton {
            background-color: #ff4444;
        }

        #micButton {
            background-color: #44aa44;
        }

        #micButton.active {
            background-color: #ff6b6b;
        }

        .status {
            margin-top: 20px;
            font-size: 1em;
            color: #333;
        }
    </style>
</head>
<body>
    <button id="sirenButton" class="button">Play Siren</button>
    <button id="micButton" class="button">Start Microphone</button>
    <div id="status" class="status"></div>

    <script>
        let audioContext;
        let micStream;
        let isMicActive = false;
        const sirenButton = document.getElementById('sirenButton');
        const micButton = document.getElementById('micButton');
        const statusDiv = document.getElementById('status');
        const sirenAudio = new Audio('assets/sirine.mp3');
        
        // Initialize audio context on user interaction
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Siren button functionality
        sirenButton.addEventListener('click', () => {
            initAudioContext();
            if (sirenAudio.paused) {
                sirenAudio.play().catch(error => {
                    statusDiv.textContent = 'Error playing siren: ' + error.message;
                });
                sirenButton.textContent = 'Stop Siren';
            } else {
                sirenAudio.pause();
                sirenAudio.currentTime = 0;
                sirenButton.textContent = 'Play Siren';
            }
        });

        // Microphone button functionality
        micButton.addEventListener('click', async () => {
            initAudioContext();
            
            if (!isMicActive) {
                try {
                    // Specifically request the built-in microphone
                    const constraints = {
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false,
                            deviceId: 'default' // This ensures we use the default/built-in microphone
                        }
                    };

                    micStream = await navigator.mediaDevices.getUserMedia(constraints);
                    
                    // Create audio source from microphone stream
                    const source = audioContext.createMediaStreamSource(micStream);
                    
                    // Connect directly to audio output
                    source.connect(audioContext.destination);
                    
                    isMicActive = true;
                    micButton.textContent = 'Stop Microphone';
                    micButton.classList.add('active');
                    statusDiv.textContent = 'Microphone is active';
                    
                } catch (error) {
                    statusDiv.textContent = 'Error accessing microphone: ' + error.message;
                }
            } else {
                // Stop microphone
                if (micStream) {
                    micStream.getTracks().forEach(track => track.stop());
                }
                isMicActive = false;
                micButton.textContent = 'Start Microphone';
                micButton.classList.remove('active');
                statusDiv.textContent = 'Microphone is inactive';
            }
        });

        // Handle page visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Stop everything when page is hidden
                if (micStream) {
                    micStream.getTracks().forEach(track => track.stop());
                }
                sirenAudio.pause();
                sirenAudio.currentTime = 0;
                isMicActive = false;
                micButton.textContent = 'Start Microphone';
                micButton.classList.remove('active');
                sirenButton.textContent = 'Play Siren';
                statusDiv.textContent = 'Audio stopped due to page becoming inactive';
            }
        });
    </script>
</body>
</html>
