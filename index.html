<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Control System</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .button {
            width: 80%;
            max-width: 300px;
            height: 100px;
            margin: 20px;
            border: none;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .button:active {
            transform: scale(0.95);
        }

        #sirenButton {
            background-color: #ff4444;
        }

        #micButton {
            background-color: #44aa44;
        }

        #micButton.active {
            background-color: #ff6b6b;
        }

        .status {
            margin-top: 20px;
            font-size: 1em;
            color: #333;
        }
    </style>
</head>
<body>
    <button id="sirenButton" class="button">Play Siren</button>
    <button id="micButton" class="button">Start Microphone</button>
    <div id="status" class="status"></div>

    <script>
        const sirenButton = document.getElementById('sirenButton');
        const micButton = document.getElementById('micButton');
        const statusDiv = document.getElementById('status');
        const sirenAudio = new Audio('assets/sirine.mp3');
        
        // Audio elements for mic routing
        const dummyAudio = new Audio();
        dummyAudio.loop = true;
        const micAudio = new Audio();
        micAudio.loop = true;
        
        let micStream = null;
        let isMicActive = false;
        let mediaRecorder = null;

        // Debug info display
        function updateDebugInfo(message) {
            console.log(message);
            statusDiv.textContent = message;
        }

        // Force media audio mode by playing silent audio
        async function forceSpeakerOutput() {
            try {
                // Create and play silent audio to force media mode
                const silentAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
                silentAudio.loop = true;
                await silentAudio.play();
                return true;
            } catch (e) {
                console.log('Silent audio error:', e);
                return false;
            }
        }

        // Siren button functionality
        sirenButton.addEventListener('click', async () => {
            await forceSpeakerOutput(); // Force speaker mode before playing
            if (sirenAudio.paused) {
                sirenAudio.play().catch(error => {
                    updateDebugInfo('Error playing siren: ' + error.message);
                });
                sirenButton.textContent = 'Stop Siren';
            } else {
                sirenAudio.pause();
                sirenAudio.currentTime = 0;
                sirenButton.textContent = 'Play Siren';
            }
        });

        // Microphone button functionality
        micButton.addEventListener('click', async () => {
            if (!isMicActive) {
                try {
                    // Force speaker mode first
                    await forceSpeakerOutput();
                    
                    updateDebugInfo('Requesting microphone access...');
                    
                    // Get microphone stream with specific constraints for media routing
                    micStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            // Disable all processing to prevent call mode
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false,
                            // Chrome-specific constraints
                            googEchoCancellation: false,
                            googAutoGainControl: false,
                            googNoiseSuppression: false,
                            googHighpassFilter: false,
                            // Attempt to force communication mode off
                            channelCount: 2, // Stereo to force media mode
                            latency: 0
                        }
                    });

                    // List audio devices for debugging
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    console.log('Audio devices:', devices.filter(d => d.kind === 'audioinput' || d.kind === 'audiooutput'));

                    // Create MediaRecorder to process the stream
                    mediaRecorder = new MediaRecorder(micStream, {
                        mimeType: 'audio/webm;codecs=opus',
                        audioBitsPerSecond: 128000
                    });

                    // Handle the data from MediaRecorder
                    mediaRecorder.ondataavailable = async (event) => {
                        if (event.data.size > 0 && micAudio) {
                            const audioURL = URL.createObjectURL(event.data);
                            micAudio.src = audioURL;
                            try {
                                await micAudio.play();
                                URL.revokeObjectURL(audioURL);
                            } catch (e) {
                                console.error('Audio play error:', e);
                            }
                        }
                    };

                    // Start recording with very small time slices for low latency
                    mediaRecorder.start(50);

                    isMicActive = true;
                    micButton.textContent = 'Stop Microphone';
                    micButton.classList.add('active');
                    updateDebugInfo('Microphone active - Audio routing through media channel');

                } catch (error) {
                    console.error('Setup error:', error);
                    updateDebugInfo('Error: ' + error.message);
                    await stopMicrophone();
                }
            } else {
                await stopMicrophone();
            }
        });

        // Stop microphone function
        async function stopMicrophone() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
            }
            
            if (micAudio) {
                micAudio.pause();
                micAudio.src = '';
            }
            
            micStream = null;
            mediaRecorder = null;
            isMicActive = false;
            micButton.textContent = 'Start Microphone';
            micButton.classList.remove('active');
            updateDebugInfo('Microphone stopped');
        }

        // Clean up on page hide
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isMicActive) {
                stopMicrophone();
            }
        });

        // Handle page visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Stop everything when page is hidden
                if (micStream) {
                    micStream.getTracks().forEach(track => track.stop());
                }
                sirenAudio.pause();
                sirenAudio.currentTime = 0;
                isMicActive = false;
                micButton.textContent = 'Start Microphone';
                micButton.classList.remove('active');
                sirenButton.textContent = 'Play Siren';
                statusDiv.textContent = 'Audio stopped due to page becoming inactive';
            }
        });
    </script>
</body>
</html>
