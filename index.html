<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Control System</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .button {
            width: 80%;
            max-width: 300px;
            height: 100px;
            margin: 20px;
            border: none;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .button:active {
            transform: scale(0.95);
        }

        #sirenButton {
            background-color: #ff4444;
        }

        #micButton {
            background-color: #44aa44;
        }

        #micButton.active {
            background-color: #ff6b6b;
        }

        .status {
            margin-top: 20px;
            font-size: 1em;
            color: #333;
        }
    </style>
</head>
<body>
    <button id="sirenButton" class="button">Play Siren</button>
    <button id="micButton" class="button">Start Microphone</button>
    <div id="status" class="status"></div>

    <script>
        let audioContext;
        let micStream;
        let audioElement;
        let isMicActive = false;
        const sirenButton = document.getElementById('sirenButton');
        const micButton = document.getElementById('micButton');
        const statusDiv = document.getElementById('status');
        const sirenAudio = new Audio('assets/sirine.mp3');

        // Debug info display
        function updateDebugInfo(message) {
            console.log(message);
            statusDiv.textContent = message;
        }

        // Check if we're on a mobile device
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        updateDebugInfo('Device type: ' + (isMobile ? 'Mobile' : 'Desktop'));

        // Siren button functionality
        sirenButton.addEventListener('click', () => {
            if (sirenAudio.paused) {
                sirenAudio.play().catch(error => {
                    updateDebugInfo('Error playing siren: ' + error.message);
                });
                sirenButton.textContent = 'Stop Siren';
            } else {
                sirenAudio.pause();
                sirenAudio.currentTime = 0;
                sirenButton.textContent = 'Play Siren';
            }
        });

        // Create audio element for mic output
        function createAudioElement() {
            if (!audioElement) {
                audioElement = new Audio();
                audioElement.controls = false;
                audioElement.autoplay = true;
                document.body.appendChild(audioElement);
            }
        }

        // Microphone button functionality
        micButton.addEventListener('click', async () => {
            if (!isMicActive) {
                try {
                    updateDebugInfo('Requesting microphone access...');
                    
                    // List available devices
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const audioInputs = devices.filter(device => device.kind === 'audioinput');
                    console.log('Available audio inputs:', audioInputs);

                    // Request microphone access with specific constraints
                    const constraints = {
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false,
                            latency: 0,
                            channelCount: 1,
                            sampleRate: 48000,
                            sampleSize: 16
                        }
                    };

                    micStream = await navigator.mediaDevices.getUserMedia(constraints);
                    updateDebugInfo('Microphone access granted. Setting up audio...');

                    // Create audio element if it doesn't exist
                    createAudioElement();

                    // Connect microphone to audio element
                    audioElement.srcObject = micStream;
                    await audioElement.play();

                    isMicActive = true;
                    micButton.textContent = 'Stop Microphone';
                    micButton.classList.add('active');
                    updateDebugInfo('Microphone is active and streaming');

                } catch (error) {
                    console.error('Microphone error:', error);
                    updateDebugInfo('Error: ' + error.message);
                }
            } else {
                // Stop everything
                if (micStream) {
                    micStream.getTracks().forEach(track => {
                        track.stop();
                        updateDebugInfo('Stopping track: ' + track.label);
                    });
                }
                if (audioElement) {
                    audioElement.srcObject = null;
                }
                isMicActive = false;
                micButton.textContent = 'Start Microphone';
                micButton.classList.remove('active');
                updateDebugInfo('Microphone stopped');
            }
        });

        // Handle page visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Stop everything when page is hidden
                if (micStream) {
                    micStream.getTracks().forEach(track => track.stop());
                }
                sirenAudio.pause();
                sirenAudio.currentTime = 0;
                isMicActive = false;
                micButton.textContent = 'Start Microphone';
                micButton.classList.remove('active');
                sirenButton.textContent = 'Play Siren';
                statusDiv.textContent = 'Audio stopped due to page becoming inactive';
            }
        });
    </script>
</body>
</html>
